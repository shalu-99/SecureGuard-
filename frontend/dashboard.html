
<script>
async function loadAlerts() {
    const list = document.getElementById("alertList");
    const totalAlerts = document.getElementById("totalAlerts");
    const highAlerts = document.getElementById("highAlerts");

    if (!list || !totalAlerts || !highAlerts) {
        console.error("Dashboard elements are missing.");
        return;
    }

    try {
        const response = await fetch("/api/alerts", {
            method: "GET",
            headers: {
                "Accept": "application/json"
            },
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error("Unable to load alerts");
        }

        const alerts = await response.json();

        if (!Array.isArray(alerts)) {
            throw new Error("Invalid alerts response");
        }

        totalAlerts.textContent = String(alerts.length);

        const highCount = alerts.filter(
            alert =>
                String(alert.severity || "").toLowerCase() === "high"
        ).length;

        highAlerts.textContent = String(highCount);

        // Clear old alert elements safely.
        list.replaceChildren();

        if (alerts.length === 0) {
            const empty = document.createElement("div");
            empty.className = "empty";
            empty.textContent = "No security alerts detected.";
            list.appendChild(empty);
            return;
        }

        alerts.slice(0, 10).forEach(alert => {
            const item = document.createElement("div");
            item.className = "alert";

            const dot = document.createElement("div");
            dot.className = "alert-dot";

            const details = document.createElement("div");

            const heading = document.createElement("h4");
            heading.textContent =
                String(alert.message || "Security event detected");

            const description = document.createElement("p");

            const user = alert.user_id
                ? "User ID " + String(alert.user_id)
                : "System";

            const time = alert.created_at
                ? new Date(alert.created_at).toLocaleString()
                : "Recent";

            description.textContent = user + " • " + time;

            const badge = document.createElement("div");
            badge.className = "badge";
            badge.textContent =
                String(alert.severity || "medium").toUpperCase();

            details.append(heading, description);
            item.append(dot, details, badge);
            list.appendChild(item);
        });
    } catch (error) {
        console.error("Dashboard alert error:", error);

        list.replaceChildren();

        const message = document.createElement("div");
        message.className = "empty";
        message.textContent = "Unable to connect to security API.";

        list.appendChild(message);
    }
}

loadAlerts();
setInterval(loadAlerts, 5000);
</script>
