<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureGuard Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        header {
            background: #111827;
            color: white;
            padding: 20px 30px;
        }

        header h1 {
            margin: 0;
        }

        .container {
            padding: 30px;
        }

        .cards {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            min-width: 200px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .card h3 {
            margin-top: 0;
        }

        .number {
            font-size: 30px;
            font-weight: bold;
        }

        .alerts {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .alert {
            border-left: 5px solid #dc2626;
            padding: 15px;
            margin-bottom: 12px;
            background: #fef2f2;
            border-radius: 6px;
        }

        .alert strong {
            color: #b91c1c;
        }

        .status {
            color: green;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>
    <h1>🛡️ SecureGuard</h1>
    <p>Real-Time Cybersecurity Monitoring Dashboard</p>
</header>

<div class="container">

    <div class="cards">

        <div class="card">
            <h3>Security Alerts</h3>
            <div class="number" id="alertCount">0</div>
        </div>

        <div class="card">
            <h3>System Status</h3>
            <div class="status">ONLINE</div>
        </div>

        <div class="card">
            <h3>High Severity</h3>
            <div class="number" id="highCount">0</div>
        </div>

    </div>

    <div class="alerts">
        <h2>Recent Security Alerts</h2>

        <div id="alertsContainer">
            Loading alerts...
        </div>
    </div>

</div>

<script>

async function loadAlerts() {

    try {

        const response = await fetch(
            "/api/alerts"
        );

        const alerts = await response.json();

        document.getElementById("alertCount").textContent =
            alerts.length;

        const highAlerts = alerts.filter(
            alert => alert.severity === "high"
        );

        document.getElementById("highCount").textContent =
            highAlerts.length;

        const container =
            document.getElementById("alertsContainer");

        container.innerHTML = "";

        alerts.forEach(alert => {

            const div = document.createElement("div");

            div.className = "alert";

            div.innerHTML = `
                <strong>${alert.severity.toUpperCase()} -
                ${alert.event_type}</strong>

                <p>${alert.message}</p>

                <small>
                    User ID: ${alert.user_id}
                    <br>
                    Status: ${alert.status}
                    <br>
                    Time: ${alert.created_at}
                </small>
            `;

            container.appendChild(div);
        });

    } catch (error) {

        document.getElementById("alertsContainer").innerHTML =
            "Unable to load security alerts.";

        console.error(error);
    }
}

loadAlerts();

</script>

</body>
</html>
