<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SecureGuard</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background: #0f172a;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, Helvetica, sans-serif;

            color: white;
        }

        .loader {
            text-align: center;
        }

        .shield {
            font-size: 72px;

            margin-bottom: 15px;

            animation: pulse 1.2s ease-in-out infinite;
        }

        h1 {
            margin: 0 0 8px;

            font-size: 36px;
        }

        .subtitle {
            color: #94a3b8;

            font-size: 11px;

            letter-spacing: 2px;
        }

        .spinner {
            width: 42px;
            height: 42px;

            margin: 30px auto 18px;

            border: 4px solid #334155;

            border-top: 4px solid #2563eb;

            border-radius: 50%;

            animation: spin 1s linear infinite;
        }

        .loading-text {
            color: #cbd5e1;

            font-size: 13px;
        }

        @keyframes spin {

            to {
                transform: rotate(360deg);
            }

        }

        @keyframes pulse {

            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.08);
            }

        }

    </style>

</head>


<body>


<div class="loader">

    <div class="shield">
        🛡️
    </div>

    <h1>
        SecureGuard
    </h1>

    <div class="subtitle">
        REAL-TIME CYBERSECURITY MONITORING
    </div>

    <div class="spinner"></div>

    <div class="loading-text">
        Initializing secure environment...
    </div>

</div>


<script>

    setTimeout(function () {

        window.location.href = "/dashboard";

    }, 2200);

</script>


</body>

</html>
