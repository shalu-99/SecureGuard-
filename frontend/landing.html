<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="google-site-verification" content="qoj_JNz9POgwLyNgLTT-rXymRMesp933MZTc9oU2174" />

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SecureGuard | Loading</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            font-family: Arial, Helvetica, sans-serif;

            background:
                radial-gradient(
                    circle at top left,
                    #1e3a8a 0%,
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom right,
                    #0f766e 0%,
                    transparent 30%
                ),
                #0f172a;

            color: white;
        }

        .loader {
            text-align: center;

            padding: 30px;
        }

        .shield {
            width: 90px;

            height: 90px;

            margin: 0 auto 20px;

            border-radius: 24px;

            background: #2563eb;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 52px;

            box-shadow:
                0 15px 40px rgba(37, 99, 235, 0.35);

            animation: pulse 1.4s ease-in-out infinite;
        }

        h1 {
            margin: 0;

            font-size: 38px;

            letter-spacing: 0.5px;
        }

        .subtitle {
            margin-top: 8px;

            color: #94a3b8;

            font-size: 11px;

            letter-spacing: 2px;
        }

        .spinner {
            width: 44px;

            height: 44px;

            margin: 32px auto 18px;

            border: 4px solid #334155;

            border-top: 4px solid #2563eb;

            border-radius: 50%;

            animation: spin 1s linear infinite;
        }

        .loading-text {
            color: #cbd5e1;

            font-size: 13px;

            letter-spacing: 0.3px;
        }

        .status {
            margin-top: 22px;

            display: inline-block;

            padding: 7px 13px;

            border: 1px solid #1d4ed8;

            border-radius: 20px;

            background: rgba(37, 99, 235, 0.12);

            color: #bfdbfe;

            font-size: 11px;
        }

        @keyframes spin {

            to {
                transform: rotate(360deg);
            }

        }

        @keyframes pulse {

            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.06);
            }

        }

    </style>

</head>


<body>


<div class="loader">


    <div class="shield">
        🛡️
    </div>


    <h1>
        SecureGuard
    </h1>


    <div class="subtitle">
        REAL-TIME CYBERSECURITY MONITORING
    </div>


    <div class="spinner"></div>


    <div class="loading-text">
        Initializing secure environment...
    </div>


    <div class="status">
        ● SECURE SYSTEM INITIALIZING
    </div>


</div>


<script>

    setTimeout(function () {

        window.location.href = "/auth.html";

    }, 2200);

</script>


</body>

</html>
